<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>节点测试与链式编辑器</title><style>body{background:#131923;color:#e0e7ef;font:16px 'Microsoft YaHei',sans-serif;padding:28px;max-width:1100px;margin:auto}label{display:block;margin:14px 0 6px}textarea,input,select{box-sizing:border-box;background:#202b3b;color:inherit;border:1px solid #5d728a;padding:10px;width:100%;border-radius:5px}textarea{height:120px}button{padding:10px 18px;margin:10px 8px 0 0;background:#23846c;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}small{color:#a8bacb}.node,.pair{border:1px solid #40536b;padding:8px;margin:6px 0;border-radius:4px}.pair{display:flex;gap:8px;align-items:center}.pair select{width:42%}.danger{background:#9b443e}pre{white-space:pre-wrap;max-height:360px;overflow:auto;font-size:12px}</style><h1>节点测试与链式编辑器</h1><small>先解析并测试当前输入，再从本轮全部网站通过的节点中自由选择上游与落地。两端支持 VLESS、VMess、Trojan、SS、hysteria2、tuic、anytls；链式代理只在第二阶段全部网站复测通过后导出。</small><label>Mihomo 内核</label><select id="core"></select><button id="refresh" type="button">刷新</button><p id="coreInfo"></p><label>读取 YAML/TXT 文件</label><input id="file" type="file" accept=".yaml,.yml,.txt,text/plain"><label>分享链接或 YAML（当前轮次输入）</label><textarea id="nodes" placeholder="每行 URI，或粘贴含 proxies: 的 YAML"></textarea><label>测试网站（每行一个）</label><textarea id="sites">https://github.com/
https://google.com/</textarea><button id="parse" type="button">1. 解析当前输入并显示节点</button><div id="nodeList"></div><label>链式配对</label><small>只有上一步测试全部网站通过的节点可选；选择上游 → 落地。可添加多对，不增加策略组。</small><div id="pairs"></div><button id="addPair" type="button" disabled>添加配对</button><button id="run" type="button" disabled>2. 测试链路并导出</button><label>输出 YAML 名称</label><input id="name" value="123"><label><input id="generate" type="checkbox" checked> 生成并用 Mihomo -t 校验 YAML</label><p id="status"></p><pre id="log"></pre><script src="/panel.js"></script></html>
